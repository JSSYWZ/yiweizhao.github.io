<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vocabulary Spelling Practice</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.6;
    }
    h1 {
      font-size: 24px;
      text-align: center;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .label {
      font-weight: 600;
      margin-top: 8px;
    }
    #meaning {
      font-size: 18px;
      margin: 8px 0 16px;
      color: #333;
    }
    #answerInput {
      width: 100%;
      padding: 8px 10px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      margin-top: 12px;
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }
    #feedback {
      margin-top: 10px;
      min-height: 24px;
      font-weight: 600;
    }
    #feedback.ok {
      color: #1a7f37;
    }
    #feedback.err {
      color: #d32f2f;
    }
    #progress {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }
    #wrongList {
      margin-top: 16px;
      font-size: 14px;
      color: #b71c1c;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <h1>Vocabulary Spelling Practice</h1>

  <div class="card">
    <div class="label">Definition:</div>
    <div id="meaning">Loading...</div>

    <div class="label">Type the correct word:</div>
    <input id="answerInput" type="text" autocomplete="off" />
    <button id="submitBtn">Submit (Enter)</button>

    <div id="feedback"></div>
    <div id="progress"></div>
    <div id="wrongList"></div>
  </div>

  <script>
    // ===== 1. Vocabulary list (English definitions only) =====
    const words = [
      { word: "apple", meaning: "a round fruit with red, green, or yellow skin" },
      { word: "banana", meaning: "a long curved fruit with a yellow skin" },
      { word: "orange", meaning: "a round citrus fruit with a thick orange skin" },
      { word: "teacher", meaning: "a person who helps others learn" },
      { word: "beautiful", meaning: "pleasing to the senses or mind" }
    ];

    // ===== 2. State =====
    let remaining = [...words];
    const wrongLog = [];
    let current = null;

    const meaningEl = document.getElementById("meaning");
    const inputEl = document.getElementById("answerInput");
    const feedbackEl = document.getElementById("feedback");
    const progressEl = document.getElementById("progress");
    const wrongListEl = document.getElementById("wrongList");
    const submitBtn = document.getElementById("submitBtn");

    // ===== 3. Helpers =====
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function pickNextWord() {
      if (remaining.length === 0) {
        meaningEl.textContent = "🎉 Great job! You have mastered all words.";
        feedbackEl.textContent = "";
        progressEl.textContent = `Total words: ${words.length} — All mastered!`;
        inputEl.disabled = true;
        submitBtn.disabled = true;
        return;
      }

      shuffle(remaining);
      current = remaining[0];

      meaningEl.textContent = current.meaning;
      inputEl.value = "";
      inputEl.focus();
      feedbackEl.textContent = "";
      feedbackEl.className = "";

      updateProgress();
    }

    function updateProgress() {
      const mastered = words.length - remaining.length;
      progressEl.textContent = `Mastered: ${mastered}/${words.length}`;

      if (wrongLog.length > 0) {
        wrongListEl.textContent =
          "Mistakes:\n" +
          wrongLog
            .map(
              (item, idx) =>
                `${idx + 1}. Definition: ${item.meaning}\n   Correct: ${item.correct}\n   You typed: ${item.input}`
            )
            .join("\n");
      } else {
        wrongListEl.textContent = "";
      }
    }

    function checkAnswer() {
      if (!current) return;

      const userInput = inputEl.value.trim().toLowerCase();
      const correct = current.word.toLowerCase();

      if (!userInput) {
        feedbackEl.textContent = "Please type something.";
        feedbackEl.className = "err";
        return;
      }

      if (userInput === correct) {
        feedbackEl.textContent = "✅ Correct!";
        feedbackEl.className = "ok";
        remaining = remaining.filter(item => item !== current);
      } else {
        feedbackEl.textContent = "❌ Incorrect!";
        feedbackEl.className = "err";

        wrongLog.push({
          meaning: current.meaning,
          correct: current.word,
          input: userInput
        });
      }

      setTimeout(pickNextWord, 600);
    }

    submitBtn.addEventListener("click", checkAnswer);
    inputEl.addEventListener("keydown", e => {
      if (e.key === "Enter") checkAnswer();
    });

    pickNextWord();
  </script>
</body>
</html>
